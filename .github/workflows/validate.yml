name: Validate
on:
  push:
    branches-ignore: [build/repo-design-tokens]
  pull_request:
  workflow_call:
jobs:
  site:
    permissions:
      contents: read
      discussions: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/document-engine
        with:
          repository: ${{ secrets.ENGINE_SOURCE_REPOSITORY }}
          ssh-key: ${{ secrets.ENGINE_SOURCE_SSH_KEY }}
      - run: npm ci
      - run: npm run check:tokens
      - run: npm run check:product
      - run: npm run build:site
        env:
          GH_TOKEN: ${{ github.token }}
