name: Validate
on:
  push:
    branches-ignore: [build/repo-design-tokens]
  pull_request:
  workflow_call:
jobs:
  site:
    permissions:
      contents: read
      discussions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check:tokens
      - run: npm run check:product
      - run: npm run build:site
        env:
          GH_TOKEN: ${{ github.token }}
