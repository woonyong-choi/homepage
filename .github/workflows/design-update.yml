name: Apply shared design
on:
  push:
    branches: [build/repo-design-tokens]
permissions:
  contents: read
  discussions: read
concurrency:
  group: homepage-design-apply
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  merge:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Limit automatic changes to the imported design
        run: |
          git fetch origin main
          git diff --name-only origin/main...HEAD > changed-files.txt
          test -s changed-files.txt
          if grep -Ev '^(src/vendor/theme/|package\.json$|package-lock\.json$)' changed-files.txt; then
            echo '::error::The update includes application changes.'
            exit 1
          fi
          node scripts/check-design-update.mjs origin/main
      - name: Create and merge the verified update
        env:
          GH_TOKEN: ${{ secrets.DESIGN_AUTOMATION_TOKEN || github.token }}
          AUTOMATION_TOKEN: ${{ secrets.DESIGN_AUTOMATION_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          pr=$(gh pr list --head build/repo-design-tokens --state open --json number --jq '.[0].number // empty')
          if test -n "$pr" && test -n "$AUTOMATION_TOKEN"; then
            if test "$(gh pr view "$pr" --json author --jq .author.login)" != "$(gh api user --jq .login)"; then
              gh pr close "$pr"
              pr=''
            fi
          fi
          if test -z "$pr"; then
            cat > design-pr.md <<'BODY'
          ## 변경
          - 검증한 공통 디자인과 같은 디자인을 사용하는 도표 렌더러를 적용한다.

          ## 문서
          - 없음: 기존 디자인 상속 계약의 산출물 갱신이다.

          ## 검증
          - `npm run check:tokens`, `npm run check:product`, `npm run build:site`: 선행 검증 작업 통과
          - 테스트 변경: 없음

          ## 가정
          - 이 브랜치는 공통 디자인 동기화 전용이다.

          ## 확인할 곳
          - 검증한 커밋과 PR의 최신 커밋이 같을 때만 병합한다.
          BODY
            pr=$(gh pr create --base main --head build/repo-design-tokens --title 'build(repo): 공통 디자인 업데이트 적용' --body-file design-pr.md)
          fi
          if test -z "$AUTOMATION_TOKEN"; then
            echo '검증한 PR을 준비했습니다. 사용자 명의 자동 병합은 DESIGN_AUTOMATION_TOKEN 등록 후 실행합니다.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$(gh pr view "$pr" --json headRefOid --jq .headRefOid)" = "$HEAD_SHA"
          git fetch origin main
          git merge-base --is-ancestor origin/main "$HEAD_SHA"
          gh pr merge "$pr" --squash --match-head-commit "$HEAD_SHA" --author-email "$(git log origin/main -1 --format=%ae)" --subject 'build(repo): 공통 디자인 업데이트 적용' --body ''
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/build/repo-design-tokens" --jq .object.sha)
          if test "$current" = "$HEAD_SHA"; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/build/repo-design-tokens"
          fi
